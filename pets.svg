  />

  <rect
    x="270"
    y="342"
    width="46"
    height="65"
    rx="19"
    fill="#dba66c"
  />

  <!-- Orelhas -->
  <path
    d="
      M161 145q-63-7-46 75t59 6
      m98-83q70-17 52 68t-51 21
    "

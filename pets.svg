<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 510 450"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Cachorro e gato no jardim</title>

  <desc id="description">
    Ilustração de um cachorro caramelo com coleira verde,
    acompanhado por um gato claro em um jardim.
  </desc>

  <!-- Fundo circular -->
  <circle
    cx="261"
    cy="226"
    r="168"
    fill="#d8dfb4"
  />

  <!-- Chão -->
  <path
    d="M0 390Q245 329 510 395V450H0"
    fill="#bdc997"
  />

  <!-- Planta à direita -->
  <path
    d="
      M412 378q-28-95 4-157
      m-6 76q-55-8-47-41 38 1 47 41
      m2-30q43-11 35-44-35 2-35 44
    "
    fill="#85965f"
    stroke="#85965f"
    stroke-width="5"
  />

  <!-- Planta à esquerda -->
  <path
    d="
      M95 376q20-66-7-113
      m13 70q-39-5-43-32 33-7 43 32
    "
    fill="#85965f"
  />

